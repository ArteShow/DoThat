<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoThat! — Tasks</title>

    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/components.css">

    <script src="/assets/js/api.js" defer></script>
    <script src="/assets/js/app.js" defer></script>
</head>

<body>
    <aside class="sidebar">
        <a class="logo" href="/">DoThat<span>!</span></a>
        <nav>
            <a class="nav-link" href="/">Dashboard</a>
            <a class="nav-link active" href="/tasks.html">Tasks</a>
            <a class="nav-link" href="/calendar.html">Calendar</a>
            <a class="nav-link" href="/learning.html">Learning</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="page-header">
            <div>
                <p class="eyebrow">STAY ORGANIZED</p>
                <h1>Tasks</h1>
                <p class="subtitle">Everything you need to get done.</p>
            </div>
        </header>

        <section class="card section-card">
            <h2>Create a task</h2>
            <p class="subtitle">Add something you need to get done.</p>
        
            <form id="create-task-form" class="task-form">
                <label for="task-title">Title</label>
                <input id="task-title" name="title" type="text" placeholder="e.g. Finish German homework" maxlength="200"
                    required>
        
                <label for="task-description">Description</label>
                <textarea id="task-description" name="description" placeholder="Optional details..." rows="3"></textarea>
        
                <div class="form-grid">
                    <div>
                        <label for="task-deadline">Deadline</label>
                        <input id="task-deadline" name="deadline" type="datetime-local">
                    </div>
        
                    <div>
                        <label for="task-duration">Duration (minutes)</label>
                        <input id="task-duration" name="duration" type="number" min="0" placeholder="e.g. 45">
                    </div>
        
                    <div>
                        <label for="task-priority">Priority</label>
                        <select id="task-priority" name="priority">
                            <option value="0">Normal</option>
                            <option value="1">Low</option>
                            <option value="2">High</option>
                            <option value="3">Urgent</option>
                        </select>
                    </div>
                </div>
        
                <button class="button" type="submit">Create task</button>
                <p id="create-task-message" class="form-message" aria-live="polite"></p>
            </form>
        </section>

        <section class="card section-card">
            <div class="section-header">
                <div>
                    <h2>All tasks</h2>
                    <p class="subtitle">Synced with your Go backend.</p>
                    </div>
                    <button class="button button-secondary" id="refresh-tasks" type="button">
                        Refresh
                    </button>
            </div>

            <div id="all-tasks">
                <p class="muted">Loading tasks...</p>
            </div>
<p id="tasks-message" class="form-message" aria-live="polite"></p>
        </section>
    </main>
</body>

</html>
